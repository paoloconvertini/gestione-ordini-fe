<h2 mat-dialog-title>
  Assenze del {{ data.data }}
</h2>
<mat-dialog-content>
  <mat-spinner *ngIf="loader"></mat-spinner>
  <div *ngIf="!loader">
    <div *ngIf="assenze.length === 0">Nessuna assenza trovata</div>
    <mat-card *ngFor="let a of assenze" style="margin-bottom:10px;cursor:pointer;" (click)="edit(a.id)">
      <mat-card-content>
        <div><strong>{{ a.venditoriLabel }}</strong></div>
        <div>{{ a.tipo }}</div>
        <div *ngIf="a.fasciaOraria">{{ a.fasciaOraria }}</div>
        <div *ngIf="a.note">{{ a.note }}</div>
      </mat-card-content>
    </mat-card>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="close()">Chiudi</button>
</mat-dialog-actions>
